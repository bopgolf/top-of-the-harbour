name: Update leaderboard

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch:            # "Run workflow" button / organiser page "Update now"
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "results/**"
      - "index.html"
      - "admin.html"
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  # 1. Fetch results, rebuild the data and package the website
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # always start from the latest version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch results and rebuild the leaderboard data
        run: python scripts/update.py

      - name: Save any changes
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "Update leaderboard data"
          # if another change was saved meanwhile, catch up and try again
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Retrying in 10 seconds..."
            sleep 10
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  # 2. Publish the packaged website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
