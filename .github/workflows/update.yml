name: Update leaderboard

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "*.csv"
      - "results/**"
      - "index.html"
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch results and rebuild the leaderboard data
        run: python scripts/update.py

      - name: Save any changes
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update leaderboard data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
